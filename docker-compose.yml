# Bike-risk-route — backend + 資料管線 + PostGIS
# PostGIS（002 Wave 1）：真相來源 / 查詢 / QGIS 圖層。backend runtime 目前不依賴它。
#   docker compose up -d postgis                                   # 起 DB
#   docker compose run --rm backend python -m scripts.load_to_postgis   # 灌既有 pkl/json/gpkg
#   QGIS / psql 連 localhost:5432（db=bikerisk）
#
# 常用：
#   docker compose build backend
#   docker compose run --rm backend python -m scripts.prepare_accidents_gpkg --cleaned-dir /input/cleaned --output data/raw/accidents_epsg3857.gpkg
#   docker compose run --rm backend python -m scripts.download_roads_geofabrik
#   docker compose run --rm backend python -m scripts.build_graph
#   docker compose run --rm backend python -m scripts.process_accidents
#   docker compose up backend
#
# 外部 cleaned CSV 目錄以環境變數指定（compose 檔自身的插補變數，非 backend/.env）：
#   CLEANED_CSV_DIR=/path/to/data/cleaned docker compose run --rm backend python -m scripts.prepare_accidents_gpkg --cleaned-dir /input/cleaned ...
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bike-risk-backend
    env_file:
      - backend/.env                 # 注入 GOOGLE_ROUTES_API_KEY + POSTGRES_PASSWORD 等（pydantic 直接讀）
    environment:
      # DB-centric：容器內固定連 postgis 服務的 5432（本機 venv 才用 backend/.env 的 host/port）。
      # 其餘 DB 設定（USER/PASSWORD/DB）由 backend/.env 提供，config.py 組出 DATABASE_URL。
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""               # 清空，避免 backend/.env 殘留舊 DATABASE_URL 在容器內勝出（改連元件）
    depends_on:
      postgis:
        condition: service_healthy   # DB-centric：runtime 一律連 DB，需等 postgis 就緒
    ports:
      - "8000:8000"                  # API；image 內以 --host 0.0.0.0 監聽
    volumes:
      - ./backend/data:/app/data     # raw+processed 產物保存在 host，不進 image
      - ${CLEANED_CSV_DIR:-./backend/data/cleaned}:/input/cleaned:ro  # prepare_accidents 的外部輸入（唯讀）

  postgis:
    image: imresamu/postgis:16-3.4   # 多架構（amd64 + arm64）PostGIS；官方 postgis/postgis 目前僅 amd64
    env_file:
      - backend/.env                 # 讀 POSTGRES_USER/PASSWORD/DB（與 backend 同一份；其餘 app 變數 postgis 會忽略）
    ports:
      - "5432:5432"                  # host 端 QGIS / psql（左=對外埠，有衝突改這裡；右=容器內固定 5432）
    volumes:
      - pgdata:/var/lib/postgresql/data   # 命名 volume 持久化（不進 repo）
    healthcheck:
      # 用容器內的 env（來自 env_file），使用者改 USER/DB 也一致；未設則預設 bikerisk
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bikerisk} -d $${POSTGRES_DB:-bikerisk}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
